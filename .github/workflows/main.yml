name: Build and Release Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.4'

      - name: Build React Frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Move React Build to Go Embedded Filesystem
        run: |
          mkdir -p internal/api/web_dist
          cp -r web/dist/* internal/api/web_dist/

      - name: Compile Go Backend via Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p android-app/app/libs
          gomobile bind -target=android -androidapi 24 -o android-app/app/libs/mobile.aar ./mobile

      - name: Build Android APK
        run: |
          cd android-app
          gradle assembleDebug --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ublockdns-android-debug
          path: android-app/app/build/outputs/apk/debug/ublockdns-*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: "Automated continuous build from the main branch."
          files: android-app/app/build/outputs/apk/debug/ublockdns-*.apk
          prerelease: true
